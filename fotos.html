<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Fotos en vivo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial, sans-serif; background:#f8f8f8; padding:20px; text-align:center; }
    h1 { margin:20px 0; }
    button {
      background:#d63384;
      color:#fff;
      border:none;
      padding:12px 20px;
      border-radius:20px;
      font-size:16px;
      cursor:pointer;
    }
    .galeria {
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
      gap:10px;
      margin-top:20px;
    }
    .foto-item {
      width:100%;
      height:120px;
      border-radius:10px;
      overflow:hidden;
    }
    .foto-item img {
      width:100%;
      height:100%;
      object-fit:cover;
    }
  </style>
</head>
<body>

<h1>📸 Fotos en vivo !!</h1>

<input type="file" id="fileInput" accept="image/*" hidden>
<button id="btnSubir">📸 Subí tu foto</button>

<div id="galeria" class="galeria"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyDwuP4lEqYSXzuccATa_s3QzfUKpWIVq_g",
  authDomain: "clari-xv.firebaseapp.com",
  projectId: "clari-xv",
  storageBucket: "clari-xv.firebasestorage.app",
  appId: "1:760531084277:web:f1ca4ce5fbe20a9ce3b6bc"
});

const storage = firebase.storage();
const db = firebase.firestore();
const fileInput = document.getElementById("fileInput");
const btnSubir = document.getElementById("btnSubir");
const galeria = document.getElementById("galeria");

btnSubir.onclick = () => fileInput.click();

fileInput.onchange = async () => {
  const file = fileInput.files[0];
  if (!file || !file.type.startsWith("image/")) return;

  const path = "fotos/" + Date.now() + "_" + file.name;
  const ref = storage.ref(path);
  const snap = await ref.put(file);
  const url = await snap.ref.getDownloadURL();

  await db.collection("fotos").add({
    url,
    fecha: new Date()
  });

  fileInput.value = "";
};

db.collection("fotos").orderBy("fecha", "asc").onSnapshot(snapshot => {
  galeria.innerHTML = "";
  snapshot.forEach(doc => {
    const div = document.createElement("div");
    div.className = "foto-item";
    const img = document.createElement("img");
    img.src = doc.data().url;
    div.appendChild(img);
    galeria.appendChild(div);
  });
});
</script>

</body>
</html>
