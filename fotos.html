
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Fotos en vivo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background:#f8f8f8;
      padding:20px;
      text-align:center;
    }

    h1 { margin:20px 0; }

    button {
      background:#d63384;
      color:#fff;
      border:none;
      padding:12px 20px;
      border-radius:20px;
      font-size:16px;
      cursor:pointer;
    }

    /* FOTO RESPONSIVA */
    #contenedor-foto {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 20px auto;
    }

    #contenedor-foto img {
      max-width: 95%;
      max-height: 80vh;
      border-radius: 12px;
    }

    .galeria {
      display:none;
    }

    /* ✅ POPUP */
    #popup {
      display:none;
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.6);
      justify-content:center;
      align-items:center;
      z-index:999;
    }

    #popupContenido {
      background:#fff;
      padding:30px;
      border-radius:15px;
      text-align:center;
      max-width:300px;
    }

    #popupContenido h2 {
      color:#28a745;
    }

  </style>
</head>

<body>

<h1>📸 Fotos en vivo !!</h1>

<input type="file" id="fileInput" accept="image/*" hidden>
<button id="btnSubir">📸 Subí tu foto</button>

<!-- ✅ POPUP -->
<div id="popup">
  <div id="popupContenido">
    <h2>✅ Gracias por subir tu foto</h2>
    <button onclick="location.reload()">SUBIR OTRA FOTO</button>
  </div>
</div>

<div id="galeria" class="galeria"></div>

<div id="contenedor-foto">
  <img src="vengala.jpeg" alt="foto">
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>

/* ================= CONFIG ================= */

const CLAVE_ORGANIZADOR = "clari15";

firebase.initializeApp({
  apiKey: "AIzaSyDwuP4lEqYSXzuccATa_s3QzfUKpWIVq_g",
  authDomain: "clari-xv.firebaseapp.com",
  projectId: "clari-xv",
  storageBucket: "clari-xv.firebasestorage.app",
  appId: "1:760531084277:web:f1ca4ce5fbe20a9ce3b6bc"
});

const storage = firebase.storage();
const db = firebase.firestore();

/* ================= SUBIR FOTO ================= */

const fileInput = document.getElementById("fileInput");
const btnSubir = document.getElementById("btnSubir");

btnSubir.onclick = () => fileInput.click();
/**********************************************
fileInput.onchange = async () => {
  const file = fileInput.files[0];
  if (!file || !file.type.startsWith("image/")) return;

  const path = "fotos/" + Date.now() + "_" + file.name;
  const ref = storage.ref(path);

  const snap = await ref.put(file);

  
  const url = await snap.ref.getDownloadURL();

  await db.collection("fotos").add({
    url,
    fullPath: path,
    fecha: new Date()
  });

  fileInput.value = "";

  // ✅ MOSTRAR POPUP
  document.getElementById("popup").style.display = "flex";
};
*************************************/

  fileInput.onchange = async () => {
  const file = fileInput.files[0];
  if (!file || !file.type.startsWith("image/")) return;

  const path = "fotos/" + Date.now() + "_" + file.name;
  const ref = storage.ref(path);

  const uploadTask = ref.put(file); // ✅ inicia subida

  // ✅ popup inmediato
  document.getElementById("popup").style.display = "flex";

  const snap = await uploadTask; // ✅ espera después

  const url = await snap.ref.getDownloadURL();

  await db.collection("fotos").add({
    url,
    fullPath: path,
    fecha: new Date()
  });

  fileInput.value = "";

  document.getElementById("popup").style.display = "flex";
};
  
/* ================= ELIMINAR FOTO ================= */

async function eliminarFoto(docId, fullPath) {
  const clave = prompt("Clave de administrador");
  if (clave !== CLAVE_ORGANIZADOR) {
    alert("❌ Clave incorrecta");
    return;
  }

  if (!confirm("¿Eliminar esta foto definitivamente?")) return;

  try {
    await storage.ref(fullPath).delete();
    await db.collection("fotos").doc(docId).delete();
  } catch (e) {
    alert("Error al eliminar la foto");
    console.error(e);
  }
}

</script>

</body>
</html>
