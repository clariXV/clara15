<script>
firebase.initializeApp({
  apiKey: "AIzaSyDwuP4lEqYSXzuccATa_s3QzfUKpWIVq_g",
  authDomain: "clari-xv.firebaseapp.com",
  projectId: "clari-xv",
  appId: "1:760531084277:web:f1ca4ce5fbe20a9ce3b6bc"
});

const db = firebase.firestore();
const visorImg = document.getElementById("visorImg");

let fotos = [];
let index = 0;
let interval = null;

/* ================= SLIDESHOW ================= */

function startSlideshow() {
  if (interval) clearInterval(interval);

  if (fotos.length === 0) {
    visorImg.removeAttribute("src");
    return;
  }

  visorImg.src = fotos[0];
  index = 1;

  interval = setInterval(() => {
    visorImg.src = fotos[index];
    index = (index + 1) % fotos.length;
  }, 5000);
}

/* ================= FIRESTORE ================= */

db.collection("fotos")
  .orderBy("fecha", "asc")
  .onSnapshot(snapshot => {
    const urls = [];

    snapshot.forEach(doc => {
      const data = doc.data();
      if (data && data.url) {
        urls.push(data.url);
      }
    });

    // limpiar fotos previas
    fotos = [];
    index = 0;

    // validar imágenes UNA POR UNA
    let current = 0;

    function validarSiguiente() {
      if (current >= urls.length) {
        startSlideshow();
        return;
      }

      const img = new Image();
      img.src = urls[current];

      img.onload = () => {
        fotos.push(urls[current]);
        current++;
        validarSiguiente();
      };

      img.onerror = () => {
        console.warn("Imagen inválida omitida en visor:", urls[current]);
        current++;
        validarSiguiente();
      };
    }

    validarSiguiente();
  });
</script>
