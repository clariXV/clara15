<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Visor Fotos en Vivo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root { --visor-aspect: 16 / 9; }
    body {
      font-family: Arial, sans-serif;
      background:#000;
      color:#fff;
      padding:20px;
      text-align:center;
    }
    .toolbar {
      display:flex;
      gap:10px;
      justify-content:center;
      align-items:center;
      flex-wrap:wrap;
      margin-bottom:14px;
    }
    .visor {
      width:100%;
      max-width:1000px;
      aspect-ratio: var(--visor-aspect);
      margin:0 auto;
      background:#000;
      border-radius:20px;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .visor img {
      width:100%;
      height:100%;
      object-fit:cover;
    }
  </style>
</head>
<body>

<h1>📺 Visor en vivo</h1>

<div class="toolbar">
  <label>
    Relación
    <select id="aspectSelect">
      <option value="16 / 9" selected>16:9</option>
      <option value="4 / 3">4:3</option>
      <option value="1 / 1">1:1</option>
      <option value="21 / 9">21:9</option>
      <option value="3 / 2">3:2</option>
      <option value="auto">Auto</option>
    </select>
  </label>

  <label>
    Ancho (px)
    <input id="maxWidth" type="range" min="600" max="1600" step="20" value="1000">
    <span id="mwVal">1000</span>
  </label>
</div>

<div class="visor">
  <img id="visorImg">
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyDwuP4lEqYSXzuccATa_s3QzfUKpWIVq_g",
  authDomain: "clari-xv.firebaseapp.com",
  projectId: "clari-xv",
  appId: "1:760531084277:web:f1ca4ce5fbe20a9ce3b6bc"
});

const db = firebase.firestore();
const visorImg = document.getElementById("visorImg");
const aspectSelect = document.getElementById("aspectSelect");
const maxWidth = document.getElementById("maxWidth");
const mwVal = document.getElementById("mwVal");

function applyAspect(value){
  const visor = document.querySelector(".visor");
  if(value === "auto"){
    visor.style.aspectRatio = "auto";
    visor.style.minHeight = "360px";
  } else {
    visor.style.aspectRatio = value;
    visor.style.minHeight = "";
  }
}

function applyMaxWidth(px){
  document.querySelector(".visor").style.maxWidth = px + "px";
  mwVal.textContent = px;
}

aspectSelect.onchange = e => applyAspect(e.target.value);
maxWidth.oninput = e => applyMaxWidth(e.target.value);

applyAspect(aspectSelect.value);
applyMaxWidth(maxWidth.value);

let fotos = [];
let index = 0;
let interval = null;

function startSlideshow(){
  if(interval) clearInterval(interval);
  if(!fotos.length) return;

  visorImg.src = fotos[0];
  index = 1;

  interval = setInterval(() => {
    visorImg.src = fotos[index];
    index = (index + 1) % fotos.length;
  }, 5000);
}

db.collection("fotos").orderBy("fecha", "asc").onSnapshot(snapshot => {
  fotos = [];
  snapshot.forEach(doc => {
    fotos.push(doc.data().url);
  });
  startSlideshow();
});
</script>

</body>
</html>
