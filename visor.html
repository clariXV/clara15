<script>
firebase.initializeApp({
  apiKey: "AIzaSyDwuP4lEqYSXzuccATa_s3QzfUKpWIVq_g",
  authDomain: "clari-xv.firebaseapp.com",
  projectId: "clari-xv",
  appId: "1:760531084277:web:f1ca4ce5fbe20a9ce3b6bc"
});

const db = firebase.firestore();
const visorImg = document.getElementById("visorImg");

let fotos = [];
let index = 0;
let interval = null;

/* ====== SLIDESHOW ====== */

function startSlideshow() {
  if (interval) clearInterval(interval);
  if (fotos.length === 0) return;

  visorImg.src = fotos[0];
  index = 1;

  interval = setInterval(() => {
    visorImg.src = fotos[index];
    index = (index + 1) % fotos.length;
  }, 5000);
}

/* 👉 Si una imagen falla, saltamos a la siguiente */
visorImg.onerror = () => {
  console.warn("Imagen rota saltada:", visorImg.src);
  if (fotos.length === 0) return;
  visorImg.src = fotos[index];
  index = (index + 1) % fotos.length;
};

/* ====== FIRESTORE ====== */

db.collection("fotos")
  .orderBy("fecha", "asc")
  .onSnapshot(snapshot => {
    fotos = [];
    index = 0;

    snapshot.forEach(doc => {
      const data = doc.data();
      if (data && data.url) {
        fotos.push(data.url);
      }
    });

    startSlideshow();
  });
</script>
